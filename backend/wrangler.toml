name = "openguard-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# DATABASE_URL is set as a secret by the operator:
#   wrangler secret put DATABASE_URL
# Never put it, or any secret, in this file.

# WebAuthn relying-party config for passkeys (non-secret public config).
# RP_ID must be the domain the API is served from; RP_ORIGIN the matching
# https:// origin. The self-hosted Docker path sets these via env instead
# (see .env.example); when unset anywhere, the passkeys routes default to
# these same values.
[vars]
RP_ID = "openguard-api.asmitsr.workers.dev"
RP_NAME = "OpenGuard"
RP_ORIGIN = "https://openguard-api.asmitsr.workers.dev"

[[rules]]
type = "Text"
globs = ["public/*.html"]
# fallthrough keeps the default Text rule (**/*.txt, **/*.html) alive:
# without it, this rule shadows the default by type and wrangler drops
# it (with a warning). The import matches this rule first; the default
# stays for any other .txt/.html file.
fallthrough = true
