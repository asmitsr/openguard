# OpenGuard Android — version catalog.
#
# Version policy (see android/README.md): these are the newest versions
# compatible with the pinned toolchain (compileSdk 34, AGP 8.5, Gradle 8.7,
# Kotlin 2.0). The latest 2026 releases of several Jetpack libraries require
# compileSdk 35-37 and AGP 9.x, so they are deliberately NOT used here.

[versions]
agp = "8.5.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
# Compose versions pinned explicitly (no BOM: the BOM lookup failed in CI).
# NOTE: there is NO foundation-text artifact — it was merged into
# `foundation` in 1.0.0-alpha08 (package androidx.compose.foundation.text
# unchanged), so do not add a foundation-text dependency.
compose = "1.7.2"
material3 = "1.3.0"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.2"
navigationCompose = "2.7.7"
room = "2.6.1"
work = "2.9.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
playServicesLocation = "21.3.0"
maplibre = "11.11.0"
securityCrypto = "1.0.0"
# SavedStateRegistryOwner for the decoy overlay's ComposeView (a Compose
# view outside an activity needs both view-tree owners). 1.2.1 matches
# the lifecycle 2.8.x era; no newer version needed.
savedstate = "1.2.1"
# CameraX 1.3.4 is the newest stable that builds against compileSdk 34;
# 1.4.x needs compileSdk 35. All four artifacts must share one version.
camerax = "1.3.4"
# AppAuth (OAuth 2.0 for Native Apps, RFC 8252) for Google Drive auth:
# 0.11.1 is the current release on Maven Central.
appauth = "0.11.1"
# Credential Manager (passkeys): 1.6.0 is the latest stable on Google
# Maven; do NOT use a 1.7.0-alpha.
credentials = "1.6.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Direct (not only via -ktx): ViewTreeLifecycleOwner lives in this
# artifact and the decoy overlay references it explicitly.
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "compose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-savedstate = { group = "androidx.savedstate", name = "savedstate", version.ref = "savedstate" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }
appauth = { group = "net.openid", name = "appauth", version.ref = "appauth" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
