name: Android

# Builds the OpenGuard debug APK. No Android SDK is needed on the runner
# beyond what the Android Gradle Plugin downloads; Gradle itself is
# provisioned by gradle/actions/setup-gradle (no wrapper jar is committed).

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pins Gradle 8.7 explicitly (matches android/gradle/wrapper/
      # gradle-wrapper.properties) and points at the android/ build root,
      # since the Gradle project is not at the repository root.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7
          build-root-directory: android

      - name: Build debug APK
        working-directory: android
        # Plain `gradle`, not ./gradlew: no wrapper jar is committed.
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openguard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
